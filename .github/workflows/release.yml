name: Release

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:
        inputs:
            version:
                description: "Version to release (e.g., 1.0.0)"
                required: true
                type: string
            prerelease:
                description: "Is this a pre-release?"
                required: false
                type: boolean
                default: false

jobs:
    release:
        permissions:
            contents: write
            packages: write
        uses: builtnorth/.github/.github/workflows/npm-package-release.yml@main
        with:
            version: ${{ inputs.version }}
            prerelease: ${{ inputs.prerelease }}
            package-name: "wp-component-library"
            node-version: "22"
            publish-to-npm: false
            publish-to-github: false
            use-workspace: false
        secrets:
            POLARIS_PLUGIN_GITHUB_TOKEN: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}
            NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
